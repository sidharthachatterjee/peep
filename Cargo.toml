[package]
name = "peep"
version = "0.1.0"
edition = "2024"
description = "A native macOS client for Google Chat"
repository = "https://github.com/sidharthachatterjee/peep"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI comes from Zed's repository at a fixed revision: no published release has its headless
# renderer, which the picture tests draw with.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "e944cfa2fe622a7a15041b9dfc7770933792857c", default-features = false, features = ["font-kit"] }
# Runtime compilation keeps development builds compatible with Command Line Tools alone.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e944cfa2fe622a7a15041b9dfc7770933792857c", default-features = false, features = ["font-kit", "runtime_shaders"] }
base64 = "0.22"
futures = "0.3"
image = "0.25"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSDockTile", "NSFont", "NSFontDescriptor", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry", "NSString"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip", "brotli"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1_smol = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "e944cfa2fe622a7a15041b9dfc7770933792857c", default-features = false, features = ["font-kit", "test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e944cfa2fe622a7a15041b9dfc7770933792857c", default-features = false, features = ["font-kit", "runtime_shaders", "test-support"] }
# The Mac's own text shaping, for the pictures the tests draw.
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "e944cfa2fe622a7a15041b9dfc7770933792857c", features = ["font-kit", "runtime_shaders", "test-support"] }
